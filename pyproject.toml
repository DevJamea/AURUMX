[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurumx"
version = "0.1.0"
description = "AurumX — modular multi-agent XAUUSD trading platform for MetaTrader 5 (read-only -> backtest -> paper -> demo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AurumX" }]
keywords = ["trading", "xauusd", "gold", "metatrader5", "multi-agent"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# MetaTrader5 python package is Windows-only and optional: everything except the
# live MT5 broker (backtests, paper trading, API, tests) runs without it.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests across layers",
    "live_mt5: REAL MetaTrader 5 demo tests (opt-in: AURUMX_LIVE_MT5=1; never run by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
